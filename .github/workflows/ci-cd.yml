name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t ai-meeting-analyzer:ci .
      - name: Run container (demo mode, no secrets)
        run: docker run -d --name app -p 4003:4003 --read-only --tmpfs /tmp ai-meeting-analyzer:ci
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4003/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:4003/readyz
          curl -fsS http://localhost:4003/api/config | grep '"provider":"demo"'
          curl -fsS http://localhost:4003/ | grep -q NexusMeet
          curl -fsS -X POST http://localhost:4003/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"text":"Ana: I will send the report by Friday.\nBruno: Thanks!"}' | grep '"assignee":"Ana"'
          curl -sS -N --max-time 3 http://localhost:4003/api/stream-meeting > sse.txt || true
          grep MEETING_START sse.txt
      - name: Container is non-root and healthy
        run: |
          test "$(docker exec app id -u)" != "0"
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs app
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker logs app || true
