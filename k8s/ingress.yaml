apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-meeting-analyzer-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-meeting-analyzer-svc
            port:
              number: 4003
