<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusMeet - Live AI Intelligence</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="top-nav">
      <div class="logo">NexusMeet <span>AI</span></div>
      <div class="meeting-info">Planning Meeting: Analytics Dashboard</div>
      <div class="status-indicator">
        <span class="pulse"></span> Live Analysis Active
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-layout">
      
      <!-- Video Area Mock -->
      <section class="video-grid">
        <div class="video-box speaking" id="video-alice">
          <div class="avatar">A</div>
          <div class="name-tag">Alice (Lead)</div>
        </div>
        <div class="video-box" id="video-bob">
          <div class="avatar">B</div>
          <div class="name-tag">Bob (Backend)</div>
        </div>
        <div class="video-box" id="video-charlie">
          <div class="avatar">C</div>
          <div class="name-tag">Charlie (Data)</div>
        </div>
      </section>

      <!-- Bottom Panel (Kanban + Chart) -->
      <section class="intelligence-panel">
        <div class="panel-section kanban-section">
          <h3><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h12zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2z"/><path d="M4.5 3a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 1 0v-9a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 1 0v-9a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 1 0v-9a.5.5 0 0 0-.5-.5z"/></svg> Live Action Items</h3>
          <div class="kanban-board">
            <div class="kanban-column" id="col-todo">
              <div class="col-header">To Do</div>
              <div class="cards-container"></div>
            </div>
            <div class="kanban-column" id="col-in-progress">
              <div class="col-header">In Progress</div>
              <div class="cards-container"></div>
            </div>
          </div>
        </div>
        
        <div class="panel-section sentiment-section">
          <h3><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11 2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v12h.5a.5.5 0 0 1 0 1H.5a.5.5 0 0 1 0-1H1v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3h1V7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7h1V2zm1 12h2V2h-2v12zm-3 0V7H7v7h2zm-5 0v-3H2v3h2z"/></svg> Conversation Sentiment</h3>
          <div class="chart-container">
            <canvas id="sentimentChart"></canvas>
          </div>
        </div>
      </section>
      
      <!-- Right Sidebar: Transcript -->
      <aside class="transcript-sidebar">
        <div class="sidebar-header">
          <h3>Live Transcript</h3>
          <div class="ai-badge">AI Listening</div>
        </div>
        <div class="transcript-content" id="transcript-container">
          <!-- Transcripts injected here -->
          <div class="waiting-text">Waiting for meeting to begin...</div>
        </div>
      </aside>

    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
